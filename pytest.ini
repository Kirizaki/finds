[pytest]
pythonpath = .
# 30 minutes default timeout
timeout = 1800
markers = 
    # faults classes
    contentions: thread, i/o, and cpu contentions tests
    deadlocks: circular-wait deadlocks tests
    hazards: hazards / race condition (ie. TOCTOU) tests

    long: long-running tests
    stress: long-running stress test
