name: Linter check

on:
  push:
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run lint
      run: |
        ruff check .
