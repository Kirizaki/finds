name: Pull Request must pass tests

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name : Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Lint
      run: uv run --only-dev ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name : Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Setup dependencies
      run: uv sync

    - name: Run tests
      run: |
        uv run pytest -s -v -m "not stress and not long" --junitxml=results/junit.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          results/junit.xml
          results/report.html
