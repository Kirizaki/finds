name: Pull Request must pass tests

on:
  pull_request:

jobs:
  test:
    if: >
      github.event_name != 'push' ||
      github.event_name != 'pull_request' ||
      !contains(github.event.head_commit.message, 'omit-pr-test')

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest -s -v -m "not stress and not long"
