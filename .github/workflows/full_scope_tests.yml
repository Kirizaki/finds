name: Full scope

on:
  workflow_dispatch:

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name : Setup uv
      uses: astral-sh/setup-uv@v6

    - name: Setup dependencies
      run: uv sync

    - name: Run tests
      run: |
        uv run pytest -s -v --junitxml=results/junit.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-scope-test-results
        path: |
          results/junit.xml
          results/report.html
